<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Calendario de trabajo: turnos, descansos, domingos x2 y festivos x3." />
    <meta name="theme-color" content="#2e4a3e" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Apex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Apex Calendar</title>
    <script>
      // Aplica el modo claro/oscuro guardado antes de pintar, para evitar un parpadeo.
      try {
        var t = JSON.parse(localStorage.getItem('apex.settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">Saltar al contenido</a>

    <header class="app-header">
      <h1 class="brand"><a href="#/">Apex Calendar</a></h1>
      <nav class="tabs" aria-label="Vistas">
        <a href="#/mes" data-view="mes">Mes</a>
        <a href="#/semana" data-view="semana">Semana</a>
        <a href="#/dia" data-view="dia">Día</a>
        <a href="#/buscar" data-view="buscar">Buscar</a>
        <a href="#/recordatorios" data-view="recordatorios">Recordatorios</a>
        <a href="#/ajustes" data-view="ajustes">Ajustes</a>
      </nav>
    </header>

    <main>
      <div class="toolbar" id="toolbar">
        <nav class="period-nav" aria-label="Cambiar periodo">
          <button id="prev" type="button" aria-label="Mes anterior">←</button>
          <button id="today" type="button">Hoy</button>
          <button id="next" type="button" aria-label="Mes siguiente">→</button>
        </nav>
        <ul class="legend" aria-label="Simbología">
          <li><span class="swatch swatch-work"></span>Trabajo</li>
          <li><span class="swatch swatch-rest"></span>Descanso</li>
          <li><span class="pay pay-x2">x2</span>Domingo trabajado</li>
          <li><span class="pay pay-x3">x3</span>Festivo trabajado</li>
        </ul>
      </div>
      <section id="view" tabindex="-1" aria-label="Contenido">
        <noscript>Apex Calendar necesita JavaScript activado para mostrar el calendario.</noscript>
      </section>
    </main>

    <footer class="app-footer">
      <span>Festivos oficiales de México y Querétaro</span>
      <span id="version"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
